# -----------------------------------------------------
# Shadow Slave Gothic Void & Purple Window & Blur Overrides
# Complete Black Background · Pure White Typography · Dark Purple Accents
# -----------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    col.active_border = rgb(9d4edd) rgb(ffffff) 45deg
    col.inactive_border = rgba(050508bb)
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = on
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(60096c40)
    }
}

# -----------------------------------------------------
# React-Bits Style Smooth Animations
# -----------------------------------------------------
animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = smoothGlide, 0.25, 0.9, 0.3, 1
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, easeOutExpo, popin 80%
    animation = windowsIn, 1, 4, easeOutExpo, popin 80%
    animation = windowsOut, 1, 3, smoothGlide, popin 85%
    animation = border, 1, 6, default
    animation = fade, 1, 3, easeOutExpo
    animation = workspaces, 1, 5, easeOutExpo, slide
}

$terminal = kitty
exec-once = bash ~/.config/hypr/scripts/start-ui.sh
exec-once = bash ~/.config/hypr/scripts/battery-optimizer.sh &
exec-once = ~/.config/nwg-dock-hyprland/launch.sh
# -----------------------------------------------------
# Battery Optimization & Compositor Efficiency
# (Note: vfr is natively enabled in Hyprland 0.50+)
# -----------------------------------------------------
misc {
    vrr = 1                 # Variable Refresh Rate (1 = on)
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

windowrule = match:class = dotfiles-floating, float = true

# -----------------------------------------------------
# Universal Window Closing & Process Control
# -----------------------------------------------------
bind = ALT, F4, killactive
bind = SUPER, Q, killactive
bind = SUPER, C, killactive
bind = SUPER, W, killactive
bind = SUPER SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill

# Window Management (Tiling & Floating Toggle)
bind = SUPER, T, togglefloating
bind = SUPER, F, fullscreen, 0
bind = SUPER, M, fullscreen, 1

# View Home / Show Desktop (Jump to clean empty workspace)
bind = SUPER, D, workspace, empty
bind = SUPER, H, workspace, empty
bind = SUPER, E, exec, dolphin

# Clipboard Manager
bind = SUPER, V, exec, ~/.config/ml4w/scripts/ml4w-cliphist

# Layer Rules for Dramatic Rofi & Quick Settings Transitions
# layerrule = blur on, match:namespace rofi
# layerrule = animation popin 85%, match:namespace rofi

# Window Rules for Tools & Settings
windowrule = match:class = gsimplecal, float = true
windowrule = match:class = gsimplecal, pin = true
windowrule = match:class = kcmshell6, float = true
windowrule = match:class = systemsettings, float = true
windowrule = match:class = pavucontrol, float = true

# Auto-assign Default Domains (Optional workspace assignment)
# windowrule = match:class = firefox, workspace = 1
# windowrule = match:class = code, workspace = 2
# windowrule = match:class = vscodium, workspace = 2

# Screenshot Shortcuts (Native Wayland Grimblast - works in Hyprland)
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = SHIFT, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = SUPER, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = SUPER, R, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = SUPER SHIFT, R, exec, ~/.config/hypr/scripts/screenshot.sh --instant
bind = SUPER ALT, F, exec, ~/.config/hypr/scripts/screenshot.sh --instant

# Terminal & App Spawning
bind = SUPER, RETURN, exec, kitty
bind = SUPER SHIFT, RETURN, exec, [float] kitty
bind = SUPER CTRL, RETURN, exec, konsole
bind = ALT, RETURN, exec, kitty

# -----------------------------------------------------
# Fast Access Hotkeys (ALT + Numbers for Mouse/Keyboard Hybrid)
# -----------------------------------------------------
bind = ALT, 1, exec, konsole
bind = ALT, 2, exec, ~/.config/ml4w/settings/browser.sh
bind = ALT, 3, exec, dolphin
bind = ALT, 4, exec, code
bind = ALT, 5, exec, /home/aetheon-star/AETHER/.venv/bin/python3 /home/aetheon-star/AETHER/app/main.py
bind = ALT, 6, exec, kdeconnect-app
bind = ALT, 7, exec, pavucontrol
bind = ALT, 8, exec, ~/.config/ml4w/scripts/ml4w-cliphist
bind = ALT, 9, exec, ~/.config/hypr/scripts/keybindings.sh

# Mouse-friendly App Launcher & Cheatsheet
bind = SUPER, SPACE, exec, ~/.config/hypr/scripts/launcher.sh
bind = SUPER, F1, exec, ~/.config/hypr/scripts/keybindings.sh
bind = SUPER, A, exec, konsole -e /home/aetheon-star/.local/bin/agy --continue
bind = ALT, A, exec, konsole -e /home/aetheon-star/.local/bin/agy --continue
