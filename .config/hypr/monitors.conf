# ==============================================================================
#  ❖ S H A D O W   S L A V E   —   M O N I T O R S   &   H A R D W A R E ❖
#  Machine-Specific Display & GPU Overrides
#  Customize this file for your specific laptop or desktop setup.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DISPLAY CONFIGURATION
# ------------------------------------------------------------------------------
# Default fallback: auto-detect any monitor with preferred resolution & auto-placement
monitor=,preferred,auto,1

# --- Common Monitor Configurations (Uncomment & customize for your hardware) ---

# [Setup A] Standard Laptop Internal Screen:
# monitor = eDP-1, 1920x1080@60, 0x0, 1

# [Setup B] Dual Display (Laptop below external HDMI monitor):
# monitor = eDP-1, 1920x1080@60, 0x1080, 1
# monitor = HDMI-A-1, 1920x1080@60, 0x0, 1

# [Setup C] HiDPI / 2K Display (with fractional scaling 1.25x):
# monitor = eDP-1, 2560x1440@120, 0x0, 1.25

# [Setup D] Ultrawide High-Refresh Display:
# monitor = DP-1, 3440x1440@144, 0x0, 1

# [Setup E] Mirrored / Presentation Mode:
# monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1


# ------------------------------------------------------------------------------
# 2. MACHINE-SPECIFIC HARDWARE & GPU ENVIRONMENT OVERRIDES
# ------------------------------------------------------------------------------

# --- NVIDIA GPU Configuration (Uncomment if using proprietary NVIDIA drivers) ---
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct
# env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Virtual Machine / Software Rendering (KVM / QEMU) ---
# env = WLR_RENDERER_ALLOW_SOFTWARE,1
