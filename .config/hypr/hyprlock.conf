# Shadow Slave — Stormlit Citadel & Storm Sea Map Lockscreen

general {
    ignore_empty_input = true
    grace = 1
}

background {
    monitor =
    path = /home/aetheon-star/Pictures/Shadow Slave_ Stormlit Citadel.png
    blur_passes = 1
    blur_size = 3
    noise = 0.01
    contrast = 0.95
    brightness = 0.78
    vibrancy = 0.2
}

# Insignia: Storm Sea Map Holographic Badge
image {
    monitor =
    path = /home/aetheon-star/Pictures/Shadow Slave_ Storm Sea Map.png
    size = 200
    rounding = 20
    border_size = 2
    border_color = rgba(199, 125, 255, 0.8) rgba(60, 9, 108, 0.9) 45deg
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.85)
}

# Title: Dramatic Shadow Slave Calligraphy
label {
    monitor =
    text = ❖   S H A D O W   S L A V E   ❖
    color = rgb(230, 215, 255)
    font_size = 22
    font_family = Grenze Gotisch
    position = 0, 48
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Subtitle / Lore
label {
    monitor =
    text = The Stormlit Citadel  ·  Forgotten Shore
    color = rgb(199, 125, 255)
    font_size = 12
    font_family = Grenze Gotisch
    position = 0, 24
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgb(250, 245, 255)
    font_size = 54
    font_family = Fira Sans SemiBold
    position = 0, -28
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d, %Y')"
    color = rgb(180, 150, 230)
    font_size = 14
    font_family = Fira Sans Medium
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Password Input Field
input-field {
    monitor =
    size = 290, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(10, 6, 20, 0.85)
    font_color = rgb(250, 245, 255)
    font_family = Fira Sans Medium
    outer_color = rgba(157, 78, 221, 0.9) rgba(60, 9, 108, 0.9) 45deg
    fade_on_empty = false
    placeholder_text = <span foreground="##c77dff">Enter True Name...</span>
    hide_input = false
    rounding = 12
    check_color = rgb(199, 125, 255)
    fail_color = rgb(255, 77, 109)
    fail_text = <i>Lost in the Dark <b>($ATTEMPTS)</b></i>
    position = 0, -135
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.85)
}
