general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim monitor backlight after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = ~/.local/bin/brightnessctl -s set 20%
    on-resume = ~/.local/bin/brightnessctl -r
}

# 2. Lock screen after 4 minutes (240s)
listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

# 3. Screen off after 4.5 minutes (270s)
listener {
    timeout = 270
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && ~/.local/bin/brightnessctl -r
}

# 4. Sleep / Suspend system after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
